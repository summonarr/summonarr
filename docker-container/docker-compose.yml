services:
  postgres:
    image: postgres:17-alpine
    container_name: summonarr-postgres
    restart: unless-stopped
    # Postgres needs CHOWN/SETUID/SETGID/DAC_OVERRIDE for its init scripts
    # (running initdb as the postgres user inside the container). Drop ALL
    # then re-add only those. no-new-privileges still applies.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    # Deliberately NOT `env_file: .env` — Postgres needs POSTGRES_PASSWORD and
    # nothing else, and loading the shared file would put TOKEN_ENCRYPTION_KEY,
    # NEXTAUTH_SECRET and CRON_SECRET into this container's env (and its
    # `docker inspect`), i.e. the at-rest key sitting beside the ciphertext it
    # protects. Compose interpolates ./.env here exactly as it does for
    # ${SUMMONARR_VERSION} and the *_INTERVAL knobs below.
    environment:
      POSTGRES_DB: summonarr
      POSTGRES_USER: summonarr
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summonarr -d summonarr"]
      interval: 10s
      timeout: 5s
      retries: 5

  summonarr:
    image: ghcr.io/summonarr/summonarr:${SUMMONARR_VERSION:-latest}
    container_name: summonarr
    restart: unless-stopped
    # Defense-in-depth hardening (extra safety layers in case something else fails).
    # no-new-privileges blocks setuid/setgid escalation; cap_drop ALL strips
    # every Linux capability (Node doesn't need any). tmpfs /tmp routes all
    # short-lived temp writes (mkdtemp from import-session, upload buffers,
    # libvips scratch) to RAM instead of the writable container layer.
    # NOTE: read_only is NOT set — /data and /app/.next/cache need write
    # access. Adding read_only requires per-path volume/tmpfs declarations
    # which is an operator-visible breaking change; deferred to a follow-up.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m,mode=1777
    ports:
      # Every interface, so a LAN setup works as-is. Behind a reverse proxy
      # (TRUST_PROXY=true) publish to the proxy only — "127.0.0.1:3001:3000" —
      # or nothing reaching this port around the proxy is stopped from forging
      # X-Forwarded-For. See README.md, "Reach the app only through the reverse proxy".
      - "3001:3000"
    environment:
      PORT: "3000"
      # AUTH_URL (set in .env) pins the app's public base URL so auth flows and
      # redirects don't rely on the incoming Host/X-Forwarded-Host header, eliminating
      # the host-header injection risk behind a reverse proxy.
      SYNC_INTERVAL: "${SYNC_INTERVAL:-3600}"
      UPCOMING_SYNC_INTERVAL: "${UPCOMING_SYNC_INTERVAL:-86400}"
      RATINGS_SYNC_INTERVAL: "${RATINGS_SYNC_INTERVAL:-86400}"
      LIST_CACHE_SYNC_INTERVAL: "${LIST_CACHE_SYNC_INTERVAL:-21600}"
      WARM_ACTIVITY_INTERVAL: "${WARM_ACTIVITY_INTERVAL:-1800}"
      WARM_MDBLIST_INTERVAL: "${WARM_MDBLIST_INTERVAL:-86400}"
      WARM_OMDB_INTERVAL: "${WARM_OMDB_INTERVAL:-86400}"
      SCRUB_AUDIT_PII_INTERVAL: "${SCRUB_AUDIT_PII_INTERVAL:-86400}"
      PLAY_HISTORY_SYNC_INTERVAL: "${PLAY_HISTORY_SYNC_INTERVAL:-5}"
      TRASH_SYNC_INTERVAL: "${TRASH_SYNC_INTERVAL:-86400}"
      PLEX_WATCHLIST_SYNC_INTERVAL: "${PLEX_WATCHLIST_SYNC_INTERVAL:-1800}"
      TRAKT_SYNC_INTERVAL: "${TRAKT_SYNC_INTERVAL:-1800}"
      UPSTREAM_WATCH_SYNC_INTERVAL: "${UPSTREAM_WATCH_SYNC_INTERVAL:-86400}"
      ARR_WATCH_INTERVAL: "${ARR_WATCH_INTERVAL:-900}"
      ARR_SNAPSHOT_INTERVAL: "${ARR_SNAPSHOT_INTERVAL:-300}"
      WARM_RECOMMENDATIONS_INTERVAL: "${WARM_RECOMMENDATIONS_INTERVAL:-43200}"
      WARM_LIBRARY_INTERVAL: "${WARM_LIBRARY_INTERVAL:-86400}"
      PURGE_SESSIONS_INTERVAL: "${PURGE_SESSIONS_INTERVAL:-86400}"
      CRON_RETRY_INTERVAL: "${CRON_RETRY_INTERVAL:-300}"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # $$ escapes the $ so COMPOSE leaves it alone and the CONTAINER shell expands
      # it. A bare ${BASE_PATH} is interpolated by Compose from the HOST env at parse
      # time, which is empty for a sub-path image (BASE_PATH is baked in at build via
      # the Dockerfile ARG, not set on the host) — the probe then hit /api/health
      # instead of <base>/api/health, 404'd, and the container never went healthy.
      # PORT is escaped for the same reason; mirrors the Dockerfile HEALTHCHECK.
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:$${PORT:-3000}$${BASE_PATH}/api/health\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
    driver: local
